# Postgres de desenvolvimento. Subir: docker compose -f docker-compose.dev.yml up -d  (ou pnpm db:subir)
# Porta 5433 no host (evita conflito com um Postgres instalado no Windows).
# Projeto com nome próprio: sem isso ele colide com o docker-compose.yml de produção (os dois têm o serviço "db").
name: obras-dev

services:
  db:
    image: postgres:16-alpine
    container_name: obras-db-dev
    environment:
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: obras
      POSTGRES_DB: obras
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - obras-db-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obras -d obras"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  obras-db-dev:
    # Nome fixo (é o volume criado na primeira versão deste arquivo; mantém os dados de dev).
    name: acompanhador-obras_obras-db-dev
