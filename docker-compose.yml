# Teste local: docker compose up --build  ->  http://localhost:8080
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: acompanhador-obras-web:local
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
