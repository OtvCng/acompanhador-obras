# Produção (Coolify) e teste local completo: Postgres + API + web.
# Teste local: copie .env.example para .env, ajuste as senhas e rode
#   docker compose up -d --build        ->  http://localhost:8080
#   docker compose exec api node dist/setup.js   (cria o diretor inicial na primeira vez)
# Guia: docs/deploy/2026-11-09-coolify.md
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: obras
    volumes:
      - obras-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obras -d obras"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: acompanhador-obras-api:local
    environment:
      DATABASE_URL: postgres://obras:${POSTGRES_PASSWORD}@db:5432/obras
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_NOME: ${ADMIN_NOME:-Diretor}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: acompanhador-obras-web:local
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  obras-db:
